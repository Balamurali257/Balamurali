{% extends "base.html" %}

{% block title %}Set New Password – CareBuddy Vault{% endblock %}

{% block public_content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-11 col-sm-9 col-md-7 col-lg-5 col-xl-4">
            <!-- Brand Logo -->
            <div class="text-center mb-4">
                <a href="{{ url_for('auth.landing') }}" class="d-inline-flex align-items-center gap-2 text-decoration-none">
                    <div class="bg-primary text-white rounded-3 p-2.5 d-flex align-items-center justify-content-center shadow-sm" style="width: 46px; height: 46px;">
                        <i class="bi bi-key-fill fs-3"></i>
                    </div>
                    <span class="fs-3 fw-bold text-dark tracking-tight">CareBuddy</span>
                </a>
            </div>

            <!-- Card -->
            <div class="card border-0 rounded-4 shadow-sm p-4 p-sm-4 bg-white">
                <div class="text-center mb-3">
                    <h4 class="fw-bold text-dark mb-1">Set New Password</h4>
                    <p class="text-muted text-xs mb-1">
                        Enter the 6-digit code sent to <strong class="text-dark">{{ masked_phone }}</strong>
                    </p>
                </div>

                <form action="{{ url_for('auth.reset_password') }}" method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                    <!-- 6-digit OTP Code -->
                    <div class="mb-3">
                        <label class="form-label text-sm fw-semibold text-dark mb-1">
                            Verification Code (OTP)
                        </label>
                        <input type="text" 
                               name="otp" 
                               maxlength="6" 
                               inputmode="numeric" 
                               pattern="[0-9]{6}" 
                               class="form-control text-center fs-5 fw-bold tracking-widest py-2" 
                               placeholder="123456" 
                               required 
                               autofocus>
                    </div>

                    <!-- New Password -->
                    <div class="mb-3">
                        <label class="form-label text-sm fw-semibold text-dark mb-1">
                            New Password
                        </label>
                        <input type="password" 
                               name="new_password" 
                               id="resetNewPwd" 
                               class="form-control py-2 text-sm" 
                               placeholder="••••••••" 
                               required>
                        <small class="text-muted text-[11px] mt-1 d-block">
                            Min 8 characters with upper, lower, number, and special character.
                        </small>
                    </div>

                    <!-- Confirm Password -->
                    <div class="mb-4">
                        <label class="form-label text-sm fw-semibold text-dark mb-1">
                            Confirm New Password
                        </label>
                        <input type="password" 
                               name="confirm_password" 
                               class="form-control py-2 text-sm" 
                               placeholder="••••••••" 
                               required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2.5 rounded-pill fw-bold shadow-sm">
                        Update Password & Sign In
                    </button>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <a href="{{ url_for('auth.login') }}" class="text-muted text-xs text-decoration-none">
                        <i class="bi bi-arrow-left me-1"></i> Return to Sign In
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
