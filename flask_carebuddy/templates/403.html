{% extends "base.html" %}

{% block title %}Access Denied – CareBuddy{% endblock %}

{% block public_content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <div class="bg-danger-subtle text-danger rounded-circle d-inline-flex p-4 mb-3">
            <i class="bi bi-shield-slash-fill" style="font-size: 3.5rem;"></i>
        </div>
        <h2 class="fw-bold text-dark mb-2">403 – Access Prohibited</h2>
        <p class="text-muted text-sm mb-4">You do not have permission to view or modify this protected health resource.</p>
        <a href="{{ url_for('auth.landing') }}" class="btn btn-primary rounded-pill px-4 fw-semibold">
            Return to Safety
        </a>
    </div>
</div>
{% endblock %}
