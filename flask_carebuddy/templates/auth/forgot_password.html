{% extends "base.html" %}

{% block title %}Reset Password – CareBuddy Vault{% endblock %}

{% block public_content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-11 col-sm-9 col-md-7 col-lg-5 col-xl-4">
            
            <div class="text-center mb-4">
                <a href="{{ url_for('auth.landing') }}" class="d-inline-flex align-items-center gap-2 text-decoration-none">
                    <div class="bg-primary text-white rounded-3 p-2.5 d-flex align-items-center justify-content-center shadow-sm" style="width: 44px; height: 44px;">
                        <i class="bi bi-shield-lock-fill fs-3"></i>
                    </div>
                    <span class="fs-3 fw-bold text-dark tracking-tight">CareBuddy</span>
                </a>
            </div>

            <div class="card border-0 rounded-4 shadow-sm p-4 p-sm-4 bg-white">
                <div class="text-center mb-3">
                    <div class="bg-primary-subtle text-primary rounded-circle d-inline-flex p-3 mb-2">
                        <i class="bi bi-key fs-3"></i>
                    </div>
                    <h4 class="fw-bold text-dark mb-1">Forgot Password?</h4>
                    <p class="text-muted text-xs mb-0">
                        Enter your username, registered email, or verified mobile number to receive secure reset credentials.
                    </p>
                </div>

                <form action="{{ url_for('auth.forgot_password') }}" method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                    <div class="mb-4">
                        <label class="form-label text-xs fw-semibold text-dark mb-1">Username, Email, or Phone</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted ps-2.5"><i class="bi bi-person"></i></span>
                            <input type="text" name="identifier" class="form-control text-sm py-2.5" placeholder="e.g. rahul or +919876543210" required autofocus>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2.5 rounded-pill fw-bold shadow-sm d-flex align-items-center justify-content-center gap-2">
                        <span>Send Password Reset</span>
                        <i class="bi bi-arrow-right"></i>
                    </button>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <a href="{{ url_for('auth.login') }}" class="text-muted text-xs text-decoration-none">
                        <i class="bi bi-arrow-left me-1"></i> Back to Sign In
                    </a>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
