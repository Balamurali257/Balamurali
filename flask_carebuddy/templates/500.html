{% extends "base.html" %}

{% block title %}System Error – CareBuddy{% endblock %}

{% block public_content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <div class="bg-warning-subtle text-warning rounded-circle d-inline-flex p-4 mb-3">
            <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size: 3.5rem;"></i>
        </div>
        <h2 class="fw-bold text-dark mb-2">500 – Internal Vault Error</h2>
        <p class="text-muted text-sm mb-4">An unexpected server condition occurred while processing health records. Please try again.</p>
        <a href="{{ url_for('auth.landing') }}" class="btn btn-primary rounded-pill px-4 fw-semibold">
            Return to Safety
        </a>
    </div>
</div>
{% endblock %}
